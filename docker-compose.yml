services:
  web:
    build: .
    command: ["uvicorn", "webapp.app:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8086:8080"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - game-data:/data
    security_opt:
      - no-new-privileges:true
    environment:
      PYTHONUNBUFFERED: "1"
      GAME_DB_PATH: /data/games.db

volumes:
  game-data:
