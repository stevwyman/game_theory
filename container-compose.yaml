services:
  web:
    image: ${GAME_SOLVER_IMAGE:-stevwyman/game-theory-solver:latest}
    container_name: game-theory-solver
    restart: unless-stopped
    ports:
      - "8086:8080"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - game-data:/data:z
    security_opt:
      - no-new-privileges:true
    environment:
      PYTHONUNBUFFERED: "1"
      GAME_DB_PATH: /data/games.db
      ROOT_PATH: ${ROOT_PATH:-/game-theory}

volumes:
  game-data:
